# Development overrides: live source mounts + hot reload, no production build.
# Usage: make dev   (or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
services:
  backend:
    command: ["uvicorn", "backend.api_app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Compose deep-merges this with the base service's environment.
    environment:
      SCAN_INLINE: ${SCAN_INLINE:-0}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - ../backend:/app/backend
      - ../omr:/app/omr
      - ../generator:/app/generator

  worker:
    # rq has no autoreload; restart this service after changing worker code.
    volumes:
      - app_data:/app/data
      - ../backend:/app/backend
      - ../omr:/app/omr
      - ../generator:/app/generator

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_DEV_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
